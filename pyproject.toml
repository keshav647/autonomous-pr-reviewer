[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-reviewer-agent"
version = "0.1.0"
description = "Autonomous Multi-Agent Pull Request Reviewer & Security Auditor"
authors = [{ name = "Keshav Budhiraja", email = "keshavbudhiraja4321@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
    "langgraph>=0.0.30",
    "google-genai>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.scripts]
pr-reviewer = "src.cli:main"
